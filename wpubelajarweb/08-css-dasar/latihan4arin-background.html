<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Berwarna - Khalil Gibran </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Sofadi+One&display=swap');

      body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: plum;
            text-align: center;
            background-color: #0c1935;
            background-image: 
            linear-gradient(rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.5)), 
            url('https://fastly.picsum.photos/id/377/1000/1000.jpg?hmac=X5DlFTiYUTtO6JBLOBmUOMPUAgvC8BefyGtLHNAmOWk');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
    }

    h1 {
      font-size: 4em;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      /* text-shadow: 5px 5px 0 rgb(215 215 215 / 10%); */
      background-image: linear-gradient(to right, blue, purple);
      background-clip: text;
      color: transparent;
        filter: drop-shadow(0 0 10px rgba(21, 165, 198, 0.5))
    }

    .quote {
        font-size: 18px;
        line-height: 2.2;
        word-spacing: 5px;
        font-family: "Sofadi One", system-ui;
        background-color: rgb(255 255 255 / 5%);
        max-width: 600px;
        margin: auto;
        padding: 40px;
        border-radius: 70px;
        border: 1px solid rgb(255 255 255 / 10%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 5%);
    }
      span {
      color: crimson;
      text-decoration: none;
      text-shadow: 0 0 10px rgb(248, 50, 89)
    }


     .credit {
      font-size: 13px;
      letter-spacing: 2px;
      color: gold;
      font-weight: normal;
      font-family: "Emilys Candy", serif;
      text-transform: uppercase;
    }
    </style>
</head>
<body>
    <h1>Kedamaian & Cara Pandang</h1>
    <p class="quote">"Kedamaian tidak berarti berada di tempat yang tidak ada <span>kebisingan</span>, 
        <span>kesulitan</span>, atau <span>kerja keras</span>. <br>
        Kedamaian berarti berada di tengah-tengah semua itu dan tetap tenang di dalam hati."
    </p>
    <p class="credit">- Khalil Gibran</p>
</body>
</html>
