<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body {
      background-color: lightblue;
      background-image: linear-gradient(to right top, lightblue, plum);
      height: 100vh;
    }

    .kotak1 {
      width: 300px;
      height: 300px;
      background-color: palegoldenrod;
      background-image: linear-gradient(palegoldenrod, pink);
    }
    .kotak2 {
      width: 300px;
      height: 300px;
      background-color: palegoldenrod;
      background-image: radial-gradient(palegoldenrod, pink);
    }
    .kotak3 {
      width: 300px;
      height: 300px;
      background-color: palegoldenrod;
      background-image: conic-gradient(palegoldenrod, pink, lightblue);
    }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
