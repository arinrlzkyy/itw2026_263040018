<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Berwarna - Khalil Gibran </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Sofadi+One&display=swap');

        body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: plum;
      text-align: center;
      background-color: #0c1935;
    }

    h1 {
      font-size: 40px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: lightblue;
      text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      color: pink;
    }

    .quote {
      font-size: 18px;
      line-height: 2.2;
      word-spacing: 5px;
      font-family: "Sofadi One", system-ui;
    }

     span {
      color: purple;
      text-decoration: line-through;
    }

     .credit {
      font-size: 13px;
      letter-spacing: 2px;
      color: gold;
      font-weight: normal;
      font-family: "Emilys Candy", serif;
    }
    </style>
</head>
<body>
    <h1>Kedamaian & Cara Pandang</h1>
    <p class="quote">"Kedamaian tidak berarti berada di tempat yang tidak ada <span>kebisingan</span>, 
        <span>kesulitan</span>, atau <span>kerja keras</span>. <br>
        Kedamaian berarti berada di tengah-tengah semua itu dan tetap tenang di dalam hati."
    </p>
    <p class="credit">- Khalil Gibran</p>
</body>
</html>
