<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote - Khalil Gibran</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Special+Elite&display=swap');

        body {
            text-align: center;
        }

        h1 {
            font-size: 45px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            font-family: "Jim Nightshade", cursive;
            text-shadow: 5px 5px 0 gainsboro;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: gray;
            text-decoration-skip-ink: none;
        }

        .qoute {
            font-size: 20px;
            line-height: 45px;
            word-spacing: 5px;
            color: goldenrod;
            font-family: "Special Elite", system-ui;
        }

        span {
            color: darkgoldenrod;
            text-decoration: line-through;
        }

        .p2 {
            color: darkgray;
            word-spacing: 3px;
            font-size: 13px;
            font-family: "Special Elite", system-ui;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Kedamaian & Cara Pandang</h1>
    <p class="qoute">"Kedamaian tidak berarti berada di tempat yang tidak ada <span>kebisingan</span>, 
        <span>kesulitan</span>, atau <span>kerja keras</span>. <br>
        Kedamaian berarti berada di tengah-tengah semua itu dan tetap tenang di dalam hati."
    </p>
    <p class="p2">- Khalil Gibran</p>
</body>
</html>
